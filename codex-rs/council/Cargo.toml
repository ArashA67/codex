[package]
edition.workspace = true
license.workspace = true
name = "codex-council"
version.workspace = true

[lib]
doctest = false
name = "codex_council"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
codex-provider-limits = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["io-util", "io-std", "macros", "process", "rt", "time"] }
tracing = { workspace = true }
which = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
